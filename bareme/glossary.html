<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glossaire — Mémo Paie 2026 (KDS)</title>
  <meta name="description" content="Glossaire des termes et acronymes utilisés dans l'application." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;">
        <img class="brand-logo" src="../assets/logo-koesio-data-solutions.png" alt="Koesio Data Solutions" />
        <div class="brand-text">
          <div class="title">Mémo Paie 2026</div>
          <div class="subtitle">Glossaire</div>
        </div>
      </a>
    </div>

    <div class="header-controls">
      <a class="btn" href="index.html">Accueil</a>
      <a class="btn" href="help.html">Mode d’emploi</a>
      <a class="btn" href="about.html">À propos</a>
    </div>
  </header>

  <main class="app-main">
    <section class="card" style="padding:16px;">
      <div class="section-head" style="margin-bottom:10px;">
        <h2>Glossaire</h2>
        <div class="hint">Tapez un terme pour filtrer (ex. PAS, RGDU, PMSS…).</div>
      </div>

      <div class="control" style="max-width:520px;">
        <label for="gSearch">Rechercher un terme</label>
        <input id="gSearch" type="search" placeholder="PAS, net imposable, RGDU…" />
      </div>

      <div id="gList" style="margin-top:14px;"></div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-wrap">
      <div class="footer-bar" aria-hidden="true"></div>
      <div class="footer-top">
        <div class="footer-meta">
          <span>Koesio Data Solutions</span><span aria-hidden="true">•</span><span>Mémo Paie 2026</span>
        </div>
        <div class="footer-actions">
          <a class="btn" href="index.html">Accueil</a>
          <a class="btn btn-primary" href="print.html" target="_blank" rel="noopener">Télécharger PDF</a>
        </div>
      </div>
      <div id="disclaimer" class="small" style="margin:10px 0; opacity:.9"></div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
  (function(){
    const D = window.MEMO_DATA || {};
    const disc = document.getElementById("disclaimer");
    if(disc) disc.textContent = (D.meta && D.meta.disclaimer) ? D.meta.disclaimer : "";

    const listEl = document.getElementById("gList");
    const searchEl = document.getElementById("gSearch");
    const items = (D.meta && Array.isArray(D.meta.glossary) ? D.meta.glossary : [])
      .slice()
      .sort((a,b)=> String(a.term||"").localeCompare(String(b.term||""), "fr"));

    function render(){
      const q = (searchEl.value||"").trim().toLowerCase();
      const filtered = !q ? items : items.filter(x => ((x.term||"") + " " + (x.def||"")).toLowerCase().includes(q));
      listEl.innerHTML = "";
      if(filtered.length===0){
        const d = document.createElement("div");
        d.className = "small";
        d.textContent = "Aucun résultat.";
        listEl.appendChild(d);
        return;
      }
      filtered.forEach(x=>{
        const card = document.createElement("div");
        card.className = "card";
        card.style.padding = "12px";
        card.style.marginBottom = "10px";
        card.innerHTML = `<div style="font-weight:800; margin-bottom:6px;">${x.term||""}</div>
                          <div class="small">${x.def||""}</div>${x.source?`<div class="small" style="margin-top:6px; opacity:.8;">Source : ${x.source}</div>`:""}`;
        listEl.appendChild(card);
      });
    }
    searchEl.addEventListener("input", render);
    render();
  })();
  </script>

</body>
</html>
