<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bibliothèque de veille — PaieKipédia</title>
  <link rel="stylesheet" href="../assets/kds-tokens.css" />
  <link rel="icon" href="../assets/logo-koesio-data-solutions.png" />
  <script src="data.js"></script>
  <script src="../assets/config.js"></script>
  <style>
    @font-face{font-family:"Be Vietnam Pro";src:url("../bareme/assets/fonts/BeVietnamPro-Regular.ttf") format("truetype");font-weight:400;font-display:swap;}
    @font-face{font-family:"Be Vietnam Pro";src:url("../bareme/assets/fonts/BeVietnamPro-Medium.ttf") format("truetype");font-weight:500;font-display:swap;}
    @font-face{font-family:"Be Vietnam Pro";src:url("../bareme/assets/fonts/BeVietnamPro-SemiBold.ttf") format("truetype");font-weight:600;font-display:swap;}
    @font-face{font-family:"Be Vietnam Pro";src:url("../bareme/assets/fonts/BeVietnamPro-Bold.ttf") format("truetype");font-weight:700;font-display:swap;}

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --brand-1:#6e398e;--brand-2:#ea4b58;
      --bg:#fbfbfd;--surface:#ffffff;--surface-2:#f5f6fa;
      --text:#101828;--muted:#667085;--border:rgba(16,24,40,.12);
      --shadow:0 10px 25px rgba(15,23,42,.08);
      --radius:16px;--radius-md:12px;--radius-sm:8px;
      --font:"Be Vietnam Pro","BeVietnam",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --maxw:1060px;
    }
    html,body{height:100%;}
    body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    a:focus-visible,button:focus-visible{outline:3px solid rgba(65,192,240,.55);outline-offset:3px;border-radius:10px;}

    /* ── Header ── */
    .app-header{position:sticky;top:0;z-index:10;display:flex;gap:16px;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(16,24,40,.05);}
    .brand{display:flex;align-items:center;gap:14px;}
    .brand-logo{height:38px;width:auto;}
    .brand-text .title{font-size:15px;font-weight:700;letter-spacing:-.01em;}
    .brand-text .subtitle{font-size:12px;color:var(--muted);margin-top:1px;}
    .header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

    /* ── Boutons ── */
    .btn{height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius-md);border:1px solid var(--border);padding:0 14px;font-family:var(--font);font-size:13px;font-weight:700;background:var(--surface);color:var(--text);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .1s;white-space:nowrap;}
    .btn:hover{box-shadow:0 10px 26px rgba(16,24,40,.10);border-color:rgba(110,57,142,.28);}
    .btn:active{transform:scale(.99);}
    .btn-primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));}
    .btn-primary:hover{box-shadow:0 14px 40px rgba(110,57,142,.22);}
    .btn-ghost{background:transparent;border-color:transparent;box-shadow:none;}
    .btn-ghost:hover{background:rgba(16,24,40,.04);}

    /* ── KPI strip ── */
    .kpi-strip{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
    .kpi-cell{flex:1;padding:12px 20px;border-right:1px solid var(--border);display:flex;align-items:baseline;gap:10px;}
    .kpi-cell:last-child{border-right:none;}
    .kpi-num{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--brand-1);}
    .kpi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;}

    /* ── Toolbar ── */
    .toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .search-wrap{position:relative;flex:1;min-width:200px;max-width:360px;}
    .search-wrap input{width:100%;height:36px;padding:0 12px 0 36px;border:1px solid var(--border);border-radius:var(--radius-md);font-family:var(--font);font-size:13px;background:var(--surface-2);color:var(--text);transition:border-color .15s,box-shadow .15s;}
    .search-wrap input:focus{outline:none;border-color:rgba(110,57,142,.5);box-shadow:0 0 0 3px rgba(110,57,142,.10);background:var(--surface);}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none;}
    .filter-btn{height:32px;display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid var(--border);padding:0 12px;font-family:var(--font);font-size:12px;font-weight:700;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
    .filter-btn:hover{border-color:rgba(110,57,142,.3);color:var(--text);}
    .filter-btn.active{background:rgba(110,57,142,.09);border-color:rgba(110,57,142,.3);color:var(--brand-1);}
    .toolbar-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;}
    .result-count{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto;}

    /* ── Main ── */
    main{flex:1;max-width:var(--maxw);margin:0 auto;width:100%;padding:24px 18px 80px;}

    /* ── Liste publications ── */
    .pub-list{display:flex;flex-direction:column;gap:10px;}
    .pub-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .18s,border-color .18s;position:relative;}
    .pub-card:hover{box-shadow:0 16px 40px rgba(16,24,40,.11);border-color:rgba(110,57,142,.18);}
    .pub-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:linear-gradient(180deg,var(--brand-1),var(--brand-2));}

    .pub-header{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px 20px;cursor:pointer;user-select:none;}
    .pub-date{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:3px;min-width:72px;}
    .pub-title-wrap{flex:1;min-width:0;}
    .pub-title{font-size:14px;font-weight:700;line-height:1.4;margin-bottom:5px;}
    .pub-resume{font-size:13px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .pub-card.open .pub-resume{display:none;}
    .pub-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
    .pub-tag{font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;color:var(--muted);}
    .pub-tag.log-sage{background:rgba(47,82,160,.08);border-color:rgba(47,82,160,.2);color:#2f52a0;}
    .pub-tag.log-silae{background:rgba(233,75,87,.08);border-color:rgba(233,75,87,.2);color:#c0353f;}
    .pub-tag.log-lucca{background:rgba(31,174,90,.08);border-color:rgba(31,174,90,.2);color:#1fae5a;}
    .pub-tag.reforme{background:rgba(110,57,142,.08);border-color:rgba(110,57,142,.2);color:var(--brand-1);}

    .pub-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-top:2px;}
    .pub-chevron{font-size:10px;color:var(--muted);transition:transform .25s;}
    .pub-card.open .pub-chevron{transform:rotate(180deg);}
    .btn-icon{background:none;border:none;padding:4px 7px;border-radius:6px;color:var(--muted);font-size:13px;cursor:pointer;transition:background .15s,color .15s;line-height:1;}
    .btn-icon:hover{background:var(--surface-2);color:var(--text);}

    /* Détail dépliable */
    .pub-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);}
    .pub-card.open .pub-detail{max-height:4000px;}
    .pub-detail-inner{border-top:1px solid var(--border);padding:16px 20px;background:var(--surface-2);}

    /* Résumé en mode ouvert */
    .pub-resume-full{font-size:13px;color:var(--text);line-height:1.65;margin-bottom:14px;padding:12px 14px;background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border);}

    /* Texte intégral */
    .texte-integral-wrap{margin-bottom:14px;}
    .texte-integral-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .texte-integral-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
    .texte-integral{font-size:13px;line-height:1.75;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow-y:auto;}
    .texte-integral.expanded{max-height:none;}

    /* Infos bas de fiche */
    .pub-info-row{display:flex;gap:10px;flex-wrap:wrap;}
    .pub-info-block{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;}
    .pub-info-block h5{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
    .pub-info-block p{font-size:13px;line-height:1.5;color:var(--text);}
    .pub-info-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--brand-1);text-decoration:underline;text-underline-offset:2px;margin-top:5px;transition:opacity .15s;}
    .pub-info-link:hover{opacity:.7;}
    .pub-missing{font-size:12px;color:var(--muted);font-style:italic;}

    /* Vide */
    .empty-state{text-align:center;padding:4rem 1rem;color:var(--muted);}
    .empty-state .empty-icon{font-size:2rem;margin-bottom:12px;opacity:.4;}
    .empty-state p{font-size:13px;}

    /* ── Modale fiche individuelle ── */
    .overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(16,24,40,.52);align-items:flex-start;justify-content:center;padding:40px 20px;backdrop-filter:blur(3px);overflow-y:auto;}
    .overlay.open{display:flex;}
    .modal-fiche{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 64px rgba(16,24,40,.22);width:100%;max-width:760px;animation:modalIn .2s ease;}
    @keyframes modalIn{from{opacity:0;transform:translateY(12px);}}
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--border);}
    .modal-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
    .modal-title{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.35;}
    .modal-body{padding:20px 24px;}
    .modal-section{margin-bottom:20px;}
    .modal-section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .modal-texte{font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;}
    .modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}

    /* ── Zone impression ── */
    @media print {
      .app-header,.kpi-strip,.toolbar,.header-controls,.pub-actions,.btn,.overlay,.toast,
      .btn-icon,.pub-chevron{display:none!important;}
      body{background:#fff;font-size:12px;}
      .pub-card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:16px;}
      .pub-detail{max-height:none!important;}
      .pub-resume{display:block!important;-webkit-line-clamp:unset!important;}
      .texte-integral{max-height:none!important;}
      main{padding:0;}
      .pub-card::before{display:none;}
    }

    /* Toast */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff;font-family:var(--font);font-size:13px;font-weight:700;padding:8px 20px;border-radius:999px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* Footer */
    .app-footer{border-top:1px solid var(--border);background:var(--surface);}
    .footer-inner{max-width:var(--maxw);margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
  </style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img class="brand-logo" src="../assets/logo-koesio-data-solutions.png" alt="Koesio Data Solutions" />
    <div class="brand-text">
      <div class="title">Bibliothèque de veille</div>
      <div class="subtitle">PaieKipédia by KDS — publications légales &amp; déclaratives</div>
    </div>
  </div>
  <div class="header-controls">
    <a class="btn btn-ghost" href="../index.html">← Portail</a>
    <a class="btn btn-ghost" href="../reforme/index.html">Réformes</a>
    <button class="btn" onclick="imprimerSelection()">🖨 Imprimer</button>
    <a class="btn btn-primary" href="../reforme/import.html">＋ Nouvelle publication</a>
  </div>
</header>

<div class="kpi-strip" id="kpiStrip"></div>

<div class="toolbar" id="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="searchInput" placeholder="Rechercher dans les publications…" oninput="filtrer()">
  </div>
  <span class="toolbar-sep"></span>
  <div id="filtresLogiciels" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  <span class="toolbar-sep"></span>
  <div id="filtresThemes" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  <span class="result-count" id="resultCount"></span>
</div>

<main>
  <div class="pub-list" id="pubList"></div>
</main>

<footer class="app-footer">
  <div class="footer-inner">
    <span>© 2026 Koesio Data Solutions</span>
    <span id="footerDate"></span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<!-- Modale fiche individuelle -->
<div class="overlay" id="ficheOverlay" onclick="handleFicheOverlay(event)">
  <div class="modal-fiche" id="ficheModal">
    <div class="modal-head">
      <div>
        <div class="modal-kicker" id="ficheKicker"></div>
        <div class="modal-title" id="ficheTitre"></div>
      </div>
      <button class="btn btn-ghost" onclick="closeFiche()" style="font-size:16px;padding:0 10px;flex-shrink:0;">✕</button>
    </div>
    <div class="modal-body" id="ficheBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeFiche()">Fermer</button>
      <button class="btn" onclick="imprimerFiche()" id="btnImprimerFiche">🖨 Imprimer cette fiche</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// DONNÉES
// ═══════════════════════════════════════════════════════
const STORAGE_KEY = "paiekipedia-veille-v1";
const REFORMES_KEY = "paiekipedia-reformes-v2";
let publications = [];
let filtreLogiciel = null;
let filtreTheme = null;
let ficheActive = null;

function loadData() {
  try {
    // Priorité : localStorage (saisies utilisateur) > VEILLE_DATA (data.js)
    const raw = localStorage.getItem(STORAGE_KEY);
    const local = raw ? JSON.parse(raw) : [];
    const base  = (typeof VEILLE_DATA !== "undefined") ? VEILLE_DATA : [];
    // Fusion : on garde les entrées locales, on complète avec data.js si id absent
    const ids = new Set(local.map(p => p.id));
    const merged = [...local, ...base.filter(p => !ids.has(p.id))];
    // Tri : plus récent en premier
    publications = merged.sort((a, b) => (b.datePublication || "").localeCompare(a.datePublication || ""));
  } catch(e) {
    publications = (typeof VEILLE_DATA !== "undefined") ? [...VEILLE_DATA] : [];
  }
}

function getReformes() {
  try {
    const raw = localStorage.getItem(REFORMES_KEY);
    if (raw) return JSON.parse(raw);
    return (typeof REFORMES_DATA !== "undefined") ? REFORMES_DATA : [];
  } catch(e) { return []; }
}

function getTitreReforme(id) {
  if (!id) return null;
  const r = getReformes().find(r => r.id === id);
  return r ? r.titre : id;
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"short", year:"numeric"});
}

function highlight(text, query) {
  if (!query) return text;
  const safe = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(safe, "gi"), m => `<mark style="background:rgba(110,57,142,.15);color:var(--brand-1);border-radius:2px;padding:0 2px;">${m}</mark>`);
}

function logClass(l) {
  if (l === "Sage Paie") return "log-sage";
  if (l === "Silae") return "log-silae";
  if (l === "Lucca") return "log-lucca";
  return "";
}

// ═══════════════════════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════════════════════
function render() {
  renderKpis();
  renderFiltres();
  filtrer();
}

function renderKpis() {
  const total = publications.length;
  const themes = new Set(publications.flatMap(p => p.themes || [])).size;
  const avecReforme = publications.filter(p => p.reformeId).length;
  const logiciels = new Set(publications.flatMap(p => p.logiciels || [])).size;
  document.getElementById("kpiStrip").innerHTML = `
    <div class="kpi-cell"><span class="kpi-num">${total}</span><span class="kpi-label">Publications</span></div>
    <div class="kpi-cell"><span class="kpi-num">${themes}</span><span class="kpi-label">Thèmes couverts</span></div>
    <div class="kpi-cell"><span class="kpi-num">${avecReforme}</span><span class="kpi-label">Liées au tableau de bord</span></div>
    <div class="kpi-cell"><span class="kpi-num">${logiciels}</span><span class="kpi-label">Logiciels concernés</span></div>
  `;
}

function renderFiltres() {
  // Logiciels
  const logicielsUniq = [...new Set(publications.flatMap(p => p.logiciels || []))].sort();
  const fl = document.getElementById("filtresLogiciels");
  fl.innerHTML = logicielsUniq.map(l => `
    <button class="filter-btn${filtreLogiciel===l?" active":""}" onclick="toggleFiltreLog('${l}')">${l}</button>
  `).join("");

  // Top thèmes (max 8)
  const themesCount = {};
  publications.forEach(p => (p.themes||[]).forEach(t => themesCount[t] = (themesCount[t]||0)+1));
  const topThemes = Object.entries(themesCount).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
  const ft = document.getElementById("filtresThemes");
  ft.innerHTML = topThemes.map(t => `
    <button class="filter-btn${filtreTheme===t?" active":""}" onclick="toggleFiltreTheme('${t}')">${t}</button>
  `).join("");
}

function filtrer() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = publications.filter(p => {
    if (filtreLogiciel && !(p.logiciels||[]).includes(filtreLogiciel)) return false;
    if (filtreTheme   && !(p.themes||[]).includes(filtreTheme))        return false;
    if (q) {
      const hay = [p.titre, p.resume, p.texteIntegral, ...(p.themes||[])].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById("resultCount").textContent =
    filtered.length === publications.length
      ? `${publications.length} publication${publications.length>1?"s":""}`
      : `${filtered.length} / ${publications.length} publication${publications.length>1?"s":""}`;

  const list = document.getElementById("pubList");
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>Aucune publication ne correspond à cette recherche.</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(p => renderCard(p, q)).join("");
}

function renderCard(p, q="") {
  const titre = highlight(p.titre, q);
  const resume = highlight(p.resume || "", q);
  const tags = [
    ...(p.logiciels||[]).map(l => `<span class="pub-tag ${logClass(l)}">${l}</span>`),
    ...(p.themes||[]).slice(0,4).map(t => `<span class="pub-tag">${highlight(t,q)}</span>`),
    p.reformeId ? `<span class="pub-tag reforme">↗ Réforme</span>` : ""
  ].join("");

  return `<div class="pub-card" data-id="${p.id}">
    <div class="pub-header" onclick="toggleCard(this)">
      <div class="pub-date">${fmtDate(p.datePublication)}</div>
      <div class="pub-title-wrap">
        <div class="pub-title">${titre}</div>
        <div class="pub-resume">${resume}</div>
        <div class="pub-meta">${tags}</div>
      </div>
      <div class="pub-actions">
        <button class="btn-icon" title="Voir la fiche complète" onclick="ouvrirFiche(event,'${p.id}')">📄</button>
        <button class="btn-icon" title="Imprimer cette fiche" onclick="imprimerUne(event,'${p.id}')">🖨</button>
        <span class="pub-chevron">▼</span>
      </div>
    </div>
    <div class="pub-detail">
      <div class="pub-detail-inner">
        <div class="pub-resume-full">${p.resume||""}</div>

        ${p.texteIntegral ? `
        <div class="texte-integral-wrap">
          <div class="texte-integral-header">
            <span class="texte-integral-label">Texte intégral</span>
            <button class="btn" style="height:28px;font-size:11px;padding:0 10px;" onclick="toggleTexte(this)">Déplier ▼</button>
          </div>
          <div class="texte-integral" id="ti-${p.id}">${highlight(p.texteIntegral,q)}</div>
        </div>` : ""}

        <div class="pub-info-row">
          ${p.source ? `
          <div class="pub-info-block">
            <h5>📖 Source réglementaire</h5>
            <p>${p.source}</p>
          </div>` : ""}

          <div class="pub-info-block">
            <h5>📣 Diffusion</h5>
            ${p.lienTeams
              ? `<a class="pub-info-link" href="${p.lienTeams}" target="_blank">Voir le post Teams ↗</a>`
              : `<p class="pub-missing">Lien Teams non renseigné</p>`}
            ${p.reformeId ? `
              <div style="margin-top:8px;">
                <span style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);">Réforme liée</span>
                <p style="font-size:12px;color:var(--brand-1);font-weight:600;margin-top:3px;">
                  <a href="../reforme/index.html" style="color:inherit;text-decoration:underline;text-underline-offset:2px;">
                    ${getTitreReforme(p.reformeId)}
                  </a>
                </p>
              </div>` : ""}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════
function toggleCard(el) { el.closest(".pub-card").classList.toggle("open"); }

function toggleTexte(btn) {
  const card = btn.closest(".pub-card");
  const ti = card.querySelector(".texte-integral");
  ti.classList.toggle("expanded");
  btn.textContent = ti.classList.contains("expanded") ? "Replier ▲" : "Déplier ▼";
}

function toggleFiltreLog(l) { filtreLogiciel = filtreLogiciel===l ? null : l; renderFiltres(); filtrer(); }
function toggleFiltreTheme(t) { filtreTheme = filtreTheme===t ? null : t; renderFiltres(); filtrer(); }

// ═══════════════════════════════════════════════════════
// MODALE FICHE
// ═══════════════════════════════════════════════════════
function ouvrirFiche(e, id) {
  e.stopPropagation();
  const p = publications.find(p => p.id === id);
  if (!p) return;
  ficheActive = p;

  document.getElementById("ficheKicker").textContent = fmtDate(p.datePublication);
  document.getElementById("ficheTitre").textContent = p.titre;

  const tags = [
    ...(p.logiciels||[]).map(l=>`<span class="pub-tag ${logClass(l)}">${l}</span>`),
    ...(p.themes||[]).map(t=>`<span class="pub-tag">${t}</span>`)
  ].join("");

  let body = `
    <div class="pub-meta" style="margin-bottom:16px;">${tags}</div>
    <div class="modal-section">
      <div class="modal-section-label">Résumé</div>
      <div class="modal-texte">${p.resume||""}</div>
    </div>`;

  if (p.texteIntegral) {
    body += `<div class="modal-section">
      <div class="modal-section-label">Texte intégral</div>
      <div class="modal-texte">${p.texteIntegral}</div>
    </div>`;
  }

  if (p.source) {
    body += `<div class="modal-section">
      <div class="modal-section-label">Source réglementaire</div>
      <div class="modal-texte">${p.source}</div>
    </div>`;
  }

  if (p.lienTeams || p.reformeId) {
    body += `<div class="modal-section">
      <div class="modal-section-label">Liens</div>
      ${p.lienTeams ? `<div><a class="pub-info-link" href="${p.lienTeams}" target="_blank">Post Teams original ↗</a></div>` : ""}
      ${p.reformeId ? `<div style="margin-top:6px;font-size:13px;color:var(--brand-1);font-weight:600;">Réforme liée : ${getTitreReforme(p.reformeId)}</div>` : ""}
    </div>`;
  }

  document.getElementById("ficheBody").innerHTML = body;
  document.getElementById("ficheOverlay").classList.add("open");
}

function closeFiche() { document.getElementById("ficheOverlay").classList.remove("open"); ficheActive=null; }
function handleFicheOverlay(e) { if(e.target===document.getElementById("ficheOverlay"))closeFiche(); }

// ═══════════════════════════════════════════════════════
// IMPRESSION
// ═══════════════════════════════════════════════════════
function imprimerSelection() {
  // Ouvre toutes les cartes filtrées puis imprime
  document.querySelectorAll(".pub-card").forEach(c => {
    c.classList.add("open");
    const ti = c.querySelector(".texte-integral");
    if (ti) ti.classList.add("expanded");
  });
  setTimeout(() => window.print(), 300);
}

function imprimerUne(e, id) {
  e.stopPropagation();
  ouvrirFiche(e, id);
  setTimeout(() => { imprimerFiche(); }, 400);
}
